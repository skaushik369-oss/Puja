name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MantraJaap.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MantraJaap-apk
          path: MantraJaap.apk

      # On main, also publish the APK as a release so it can be downloaded straight on a phone.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest MantraJaap.apk \
            --title "Mantra Jaap (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Download MantraJaap.apk on your Android phone and open it to install."
